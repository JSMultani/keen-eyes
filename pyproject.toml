[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keen-eyes"
version = "0.1.0"
description = "AI-assisted TDD validation and compliance evidence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8"]

[project.scripts]
keen-eyes = "keen_eyes.cli.main:main"

[tool.setuptools.packages.find]
include = ["keen_eyes*"]

